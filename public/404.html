<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>MarkVision AI</title>
  <script>
    // SPA redirect trick for GitHub Pages.
    // When GitHub Pages serves a 404 (e.g. the user navigates to /markvision/auth),
    // this page is loaded. We store the requested path in sessionStorage and
    // redirect to the root. The main index.html reads sessionStorage on boot
    // and replaces the history entry with the original URL.
    var segmentCount = 1; // number of path segments in the repo name (1 for /markvision)
    var l = window.location;
    var path = l.pathname.slice(1).split('/').slice(segmentCount).join('/');
    var query = l.search.slice(1);
    var hash = l.hash.slice(1);

    var redirect = l.protocol + '//' + l.hostname +
      (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/' +
      '?p=/' + path +
      (query ? '&q=' + query : '') +
      (hash ? '&h=' + hash : '');

    l.replace(redirect);
  </script>
</head>
<body>
  <noscript>Перенаправляем на главную страницу...</noscript>
</body>
</html>
