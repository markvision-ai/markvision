<body>
  <!-- SPA redirect restore: recover original URL after GitHub Pages 404.html redirect -->
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var p = params.get('p');
      if (p) {
        var q = params.get('q');
        var h = params.get('h');
        var url = window.location.pathname.replace(/\/$/, '') + p +
          (q ? '?' + q : '') +
          (h ? '#' + h : '');
        window.history.replaceState(null, '', url);
      }
    })();
  </script>
  <div id="root"></div>

  <!-- Facebook SDK — deferred to not block FCP/LCP -->
  <script>
    window.fbAsyncInit = function () {
      if (window.location.protocol !== 'https:' && window.location.hostname === 'localhost') {
        return;
      }
      FB.init({
        appId: '1890905081453686',
        cookie: true,
        xfbml: false,
        version: 'v21.0'
      });
    };
    // Defer FB SDK load to after page is interactive
    function loadFBSDK() {
      var s = document.createElement('script');
      s.src = 'https://connect.facebook.net/ru_RU/sdk.js';
      s.async = true;
      s.defer = true;
      s.crossOrigin = 'anonymous';
      document.body.appendChild(s);
    }
    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadFBSDK, { timeout: 4000 });
    } else {
      setTimeout(loadFBSDK, 3000);
    }
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>
