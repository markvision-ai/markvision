<head>

  <!-- Open Graph -->
  <meta property="og:title" content="MarkVision AI - Умный маркетинг" />
  <meta property="og:description" content="AI-платформа для управления маркетингом медицинских клиник" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  <meta property="og:site_name" content="MarkVision AI" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

  <!-- Theme color for mobile browsers (updated by useTheme from app) -->
  <meta name="theme-color" content="#020617" />

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/markvision-logo.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon-new.svg.png" />
  <link rel="alternate icon" href="/favicon.ico" />

  <!-- Splash screens for iOS -->
  <link rel="apple-touch-startup-image" href="/pwa-icons/icon-512x512.png" />
</head>

<body>
  <div id="root"></div>

  <!-- Facebook SDK -->
  <script>
    window.fbAsyncInit = function () {
      // Пропускаем инициализацию если протокол http (для локальной разработки)
      if (window.location.protocol !== 'https:' && window.location.hostname === 'localhost') {
        console.warn('⚠️ Facebook SDK skipped due to non-HTTPS protocol');
        return;
      }

      FB.init({
        appId: '1890905081453686',
        cookie: true,
        xfbml: true,
        version: 'v21.0'
      });

      // Проверяем статус авторизации при загрузке
      FB.getLoginStatus(function (response) {
        if (response.status === 'connected') {
          console.log('✅ Facebook SDK loaded, user connected');
        } else {
          console.log('📱 Facebook SDK loaded, user not connected');
        }
      });
    };
  </script>
  <script async defer crossorigin="anonymous" src="https://connect.facebook.net/ru_RU/sdk.js">
  </script>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
